<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" role="img" aria-label="MonkeyTuan (@TuanAnhk10) — Security Research &amp; Offensive Engineering">
  <title>MonkeyTuan (@TuanAnhk10) — Security Research &amp; Offensive Engineering</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>
  <style>
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .led { animation: pulse 2.2s infinite ease-in-out; }
    .cursor { animation: blink 1s infinite step-end; }
  </style>

  <rect width="920" height="230" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="920" height="230" rx="14" fill="url(#grid)"/>
  <rect x="0" y="0" width="920" height="4" rx="2" fill="url(#accent)"/>

  <!-- Terminal Window Controls -->
  <circle cx="28" cy="26" r="5.5" fill="#f43f5e"/>
  <circle cx="46" cy="26" r="5.5" fill="#f59e0b"/>
  <circle cx="64" cy="26" r="5.5" fill="#10b981"/>
  <text x="86" y="30" fill="#64748b" font-family="Consolas, 'Courier New', monospace" font-size="12">monkeytuan@sec-lab: ~/research (zsh)</text>

  <circle class="led" cx="812" cy="26" r="4.5" fill="#10b981"/>
  <text x="824" y="30" fill="#10b981" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="bold">ONLINE</text>
  <line x1="16" y1="44" x2="904" y2="44" stroke="#1e293b" stroke-width="1"/>

  <!-- Prompt & Handle -->
  <text x="32" y="76" font-family="Consolas, 'Courier New', monospace" font-size="13.5">
    <tspan fill="#10b981">monkeytuan@sec-lab</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#38bdf8">~$</tspan><tspan fill="#e2e8f0"> whoami --verbose</tspan>
  </text>

  <text x="32" y="124" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="36" font-weight="bold" letter-spacing="1">MonkeyTuan</text>
  <text x="275" y="124" fill="#38bdf8" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="bold">@TuanAnhk10</text>

  <text x="32" y="156" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14">
    Offensive Security Research · Web/API Auditing (OWASP API Top 10) · Media DRM Cryptanalysis
  </text>

  <!-- Tags -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="bold">
    <rect x="32" y="176" width="146" height="26" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="105" y="193" fill="#22d3ee" text-anchor="middle">BOLA / IDOR</text>

    <rect x="188" y="176" width="184" height="26" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.5"/>
    <text x="280" y="193" fill="#f43f5e" text-anchor="middle">HLS AES-128-CBC DRM</text>

    <rect x="382" y="176" width="176" height="26" rx="6" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="470" y="193" fill="#c084fc" text-anchor="middle">Next.js RSC Flight</text>

    <rect x="568" y="176" width="166" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="651" y="193" fill="#34d399" text-anchor="middle">Python · C++ · Lab</text>
  </g>

  <rect class="cursor" x="748" y="180" width="9" height="18" fill="#22d3ee"/>
